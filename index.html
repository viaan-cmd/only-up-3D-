<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Only Up - Procedural Edition</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; background: #1a1a1a; }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
        }
        #gameover-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
        }
        #gameover-screen h1 { font-size: 48px; color: #ff4757; margin-bottom: 10px; }
        #gameover-screen p { font-size: 20px; margin-bottom: 20px; }
        #instructions {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 16px;
            text-shadow: 1px 1px 3px black;
            pointer-events: none;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui">Height: <span id="height-score">0</span>m</div>
    <div id="instructions">WASD / Arrow Keys to Move | Spacebar to Jump | Mouse drags camera</div>
    
    <div id="gameover-screen">
        <h1>YOU FELL!</h1>
        <p>Highest Altitude: <span id="final-score">0</span>m</p>
        <button onclick="resetGame()" style="padding: 10px 20px; font-size: 18px; cursor: pointer; background: #2ed573; border: none; color: white; border-radius: 5px;">Try Again</button>
    </div>

<script>
    // --- Engine Setup ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xaaccff); // Sky color
    scene.fog = new THREE.FogExp2(0xaaccff, 0.015);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // --- Lighting ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(20, 40, 20);
    dirLight.castShadow = true;
    scene.add(dirLight);

    // --- Game Variables & Physics ---
    let player, playerRadius = 0.6;
    let playerVelocity = new THREE.Vector3();
    let isGrounded = false;
    const gravity = -0.015;
    const jumpForce = 0.38;
    const moveSpeed = 0.12;

    let platforms = [];
    let nextPlatformZ = 0; // In Three.js, we climb up the Y axis, Z/X are horizontal
    let highestY = 0;
    let gameOver = false;

    // Input tracking
    const keys = { w: false, a: false, s: false, d: false, Space: false };
    
    // Camera Control Variables
    let cameraAngleX = 0;
    let cameraAngleY = 0.3; 
    const cameraRadius = 8;
    let isMouseDown = false;
    let previousMousePosition = { x: 0, y: 0 };

    // --- Procedural Map Generation Logic ---
    function createPlatform(x, y, z, width, depth) {
        const geometry = new THREE.BoxGeometry(width, 0.5, depth);
        // Stylized colorful grid texture simulation
        const material = new THREE.MeshStandardMaterial({ 
            color: Math.random() * 0xffffff, 
            roughness: 0.4 
        });
        const mesh = new THREE.Mesh(geometry, material);
        mesh.position.set(x, y, z);
        mesh.receiveShadow = true;
        scene.add(mesh);
        
        // Store bounding logic details for optimized collision checks
        platforms.push({
            mesh: mesh,
            minX: x - width/2, maxX: x + width/2,
            minZ: z - depth/2, maxZ: z + depth/2,
            y: y
        });
    }

    function generateChunk() {
        // Always ensure there are at least 25 platforms ahead of the player
        while (platforms.length < 25) {
            let lastY = platforms.length > 0 ? platforms[platforms.length - 1].y : 0;
            let lastX = platforms.length > 0 ? platforms[platforms.length - 1].mesh.position.x : 0;
            let lastZ = platforms.length > 0 ? platforms[platforms.length - 1].mesh.position.z : 0;

            // Procedural math constraints to make sure jumps are always humanly possible
            let stepY = 1.8 + Math.random() * 1.2; // Vertical distance range
            let stepX = (Math.random() - 0.5) * 5;  // Horizontal spread
            let stepZ = (Math.random() - 0.5) * 5;  // Depth spread

            let pWidth = 2 + Math.random() * 3;
            let pDepth = 2 + Math.random() * 3;

            // Make platforms progressively smaller/harder the higher you go
            if (lastY > 50) { pWidth *= 0.7; pDepth *= 0.7; }
            if (lastY > 120) { pWidth *= 0.5; pDepth *= 0.5; }

            createPlatform(lastX + stepX, lastY + stepY, lastZ + stepZ, pWidth, pDepth);
        }
    }

    // --- Initialization & Core Setup ---
    function init() {
        // Clear existing objects if restarting
        platforms.forEach(p => scene.remove(p.mesh));
        platforms = [];

        // Create starting zone platform
        createPlatform(0, -0.25, 0, 8, 8);

        // Spawn player sphere
        const playerGeo = new THREE.SphereGeometry(playerRadius, 32, 32);
        const playerMat = new THREE.MeshStandardMaterial({ color: 0xff4757, roughness: 0.2 });
        
        if(player) scene.remove(player);
        player = new THREE.Mesh(playerGeo, playerMat);
        player.position.set(0, 2, 0);
        player.castShadow = true;
        scene.add(player);

        playerVelocity.set(0,0,0);
        highestY = 0;
        gameOver = false;
        document.getElementById('gameover-screen').style.display = 'none';

        generateChunk();
    }

    // --- Input Event Handlers & Bug Patches ---
    window.addEventListener('keydown', (e) => {
        if (e.code === 'KeyW' || e.code === 'ArrowUp') keys.w = true;
        if (e.code === 'KeyA' || e.code === 'ArrowLeft') keys.a = true;
        if (e.code === 'KeyS' || e.code === 'ArrowDown') keys.s = true;
        if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.d = true;
        if (e.code === 'Space') keys.Space = true;
    });

    window.addEventListener('keyup', (e) => {
        if (e.code === 'KeyW' || e.code === 'ArrowUp') keys.w = false;
        if (e.code === 'KeyA' || e.code === 'ArrowLeft') keys.a = false;
        if (e.code === 'KeyS' || e.code === 'ArrowDown') keys.s = false;
        if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.d = false;
        if (e.code === 'Space') keys.Space = false;
    });

    // Mouse Controls for 3D Camera Orbiting
    window.addEventListener('mousedown', () => isMouseDown = true);
    window.addEventListener('mouseup', () => isMouseDown = false);
    window.addEventListener('mousemove', (e) => {
        if (isMouseDown) {
            let deltaX = e.clientX - previousMousePosition.x;
            let deltaY = e.clientY - previousMousePosition.y;

            cameraAngleX -= deltaX * 0.005;
            cameraAngleY = Math.max(0.05, Math.min(Math.PI/2 - 0.05, cameraAngleY + deltaY * 0.005)); // Fix vertical axis lock bug
        }
        previousMousePosition = { x: e.clientX, y: e.clientY };
    });

    // --- Physics Engine & AABB Collision Detection ---
    function updatePhysics() {
        // Apply Gravity
        playerVelocity.y += gravity;

        // Calculate horizontal direction vectors based on where the camera is facing
        let forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), cameraAngleX).normalize();
        let right = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), cameraAngleX).normalize();

        let moveDirection = new THREE.Vector3();
        if (keys.w) moveDirection.add(forward);
        if (keys.s) moveDirection.add(forward.clone().negate());
        if (keys.d) moveDirection.add(right);
        if (keys.a) moveDirection.add(right.clone().negate());
        
        moveDirection.normalize().multiplyScalar(moveSpeed);
        
        playerVelocity.x = moveDirection.x;
        playerVelocity.z = moveDirection.z;

        // Apply movement updates
        player.position.x += playerVelocity.x;
        player.position.y += playerVelocity.y;
        player.position.z += playerVelocity.z;

        // Vertical Axis Collision Check Loop
        isGrounded = false;
        let pX = player.position.x;
        let pY = player.position.y;
        let pZ = player.position.z;

        for (let i = 0; i < platforms.length; i++) {
            let p = platforms[i];
            // Check bounding boxes + offset radius for sphere shape padding
            if (pX + playerRadius > p.minX && pX - playerRadius < p.maxX &&
                pZ + playerRadius > p.minZ && pZ - playerRadius < p.maxZ) {
                
                // Falling collision check logic fix (prevents snapping through floor)
                if (playerVelocity.y <= 0 && pY - playerRadius <= p.y + 0.25 && pY >= p.y) {
                    player.position.y = p.y + 0.25 + playerRadius;
                    playerVelocity.y = 0;
                    isGrounded = true;
                    break;
                }
            }
        }

        // Jump Execution
        if (keys.Space && isGrounded) {
            playerVelocity.y = jumpForce;
            isGrounded = false;
        }

        // Track Score Metrics
        if (player.position.y > highestY) {
            highestY = player.position.y;
            document.getElementById('height-score').innerText = Math.floor(highestY);
        }

        // Dynamic Spawning cleanup (deletes old objects underneath to preserve memory)
        if (platforms.length > 0 && player.position.y - platforms[0].y > 35) {
            scene.remove(platforms[0].mesh);
            platforms.shift();
            generateChunk();
        }

        // Check Kill Boundary (Fall Out of Map Void Loop)
        if (player.position.y < highestY - 25) {
            triggerGameOver();
        }
    }

    // --- Camera Positioning Script ---
    function updateCamera() {
        // Standard third-person anchor equations matching camera rotation math
        let targetX = player.position.x + cameraRadius * Math.sin(cameraAngleX) * Math.cos(cameraAngleY);
        let targetY = player.position.y + cameraRadius * Math.sin(cameraAngleY) + 1;
        let targetZ = player.position.z + cameraRadius * Math.cos(cameraAngleX) * Math.cos(cameraAngleY);

        camera.position.set(targetX, targetY, targetZ);
        camera.lookAt(player.position.x, player.position.y + 0.5, player.position.z);
    }

    function triggerGameOver() {
        gameOver = true;
        document.getElementById('final-score').innerText = Math.floor(highestY);
        document.getElementById('gameover-screen').style.display = 'flex';
    }

    function resetGame() {
        init();
    }

    // --- Main Rendering Tick Loop ---
    function animate() {
        requestAnimationFrame(animate);

        if (!gameOver) {
            updatePhysics();
            updateCamera();
        }

        renderer.render(scene, camera);
    }

    // Handle Window Resizing Bug
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Start
    init();
    animate();
</script>
</body>
</html>
